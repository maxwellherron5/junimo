<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junimo - Stardew Valley Helper</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>🍄 Junimo</h1>
            <p>Your friendly Junimo companion</p>
        </header>

        <nav>
            <button id="items-tab" class="tab-button active">Items</button>
            <button id="bundles-tab" class="tab-button">Bundles</button>
            <button id="progress-tab" class="tab-button">Progress</button>
        </nav>

        <main>
            <!-- Items Tab -->
            <div id="items-content" class="tab-content active">
                <div class="search-container">
                    <input type="text" id="item-search" placeholder="Search items...">
                </div>
                <div id="items-grid" class="items-grid">
                    <!-- Items will be loaded here -->
                </div>
            </div>

            <!-- Bundles Tab -->
            <div id="bundles-content" class="tab-content">
                <div id="bundles-container">
                    <!-- Bundles will be loaded here -->
                </div>
            </div>

            <!-- Progress Tab -->
            <div id="progress-content" class="tab-content">
                <div id="progress-container">
                    <!-- Progress will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <script src="scripts/api.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
